<!-- ================= LOGIN / REGISTER SCREEN ================= -->

<div id="welcomeScreen"
     class="fixed inset-0 z-[9999] bg-[#060816] flex items-center justify-center p-4 overflow-y-auto">

    <!-- Background Glow -->
    <div class="absolute top-10 left-1/2 -translate-x-1/2
                w-[500px] h-[500px]
                bg-purple-600/20 blur-[150px]
                rounded-full pointer-events-none">
    </div>


    <div class="relative z-10 w-full max-w-md">

        <!-- Logo -->

        <div class="text-center mb-6">

            <div class="w-20 h-20 mx-auto mb-4
                        rounded-[28px]
                        bg-gradient-to-br
                        from-indigo-600 via-purple-600 to-pink-500
                        flex items-center justify-center
                        text-4xl font-bold
                        shadow-2xl shadow-purple-600/30
                        border border-purple-300/30">

                S

            </div>


            <h1 class="text-3xl font-extrabold">

                Sohel <span class="text-purple-400">AI</span>

            </h1>


            <p class="text-purple-400 text-xs tracking-[3px] mt-2">

                ONE APP, UNLIMITED POSSIBILITIES

            </p>

        </div>


        <!-- Login Box -->

        <div class="bg-[#11162a]/90
                    backdrop-blur-xl
                    border border-purple-500/30
                    rounded-[30px]
                    p-6
                    shadow-2xl
                    shadow-purple-950/50">


            <!-- Tabs -->

            <div class="flex bg-[#080b18]
                        border border-white/5
                        p-1.5 rounded-2xl mb-6">

                <button
                    id="loginTab"
                    onclick="switchAuthTab('login')"
                    class="flex-1 py-3 rounded-xl
                           text-xs font-bold
                           bg-gradient-to-r
                           from-purple-600 to-indigo-600">

                    Login

                </button>


                <button
                    id="signupTab"
                    onclick="switchAuthTab('signup')"
                    class="flex-1 py-3 rounded-xl
                           text-xs font-bold
                           text-gray-400">

                    Sign Up

                </button>

            </div>


            <!-- ================= LOGIN FORM ================= -->

            <form id="loginForm"
                  onsubmit="handleLogin(event)"
                  class="space-y-4">


                <div>

                    <label class="block text-xs text-gray-300 mb-2">

                        Gmail অথবা Phone Number

                    </label>


                    <input
                        type="text"
                        id="loginEmail"
                        required
                        placeholder="example@gmail.com / 017XXXXXXXX"
                        class="w-full p-3.5
                               rounded-xl
                               bg-[#1a2035]
                               border border-gray-700
                               text-sm
                               outline-none
                               focus:border-purple-500">

                </div>


                <div>

                    <label class="block text-xs text-gray-300 mb-2">

                        8 Digit Secret Code

                    </label>


                    <input
                        type="password"
                        id="loginPassword"
                        required
                        maxlength="8"
                        pattern="[0-9]{8}"
                        placeholder="••••••••"
                        class="w-full p-3.5
                               rounded-xl
                               bg-[#1a2035]
                               border border-gray-700
                               tracking-[8px]
                               text-sm
                               outline-none
                               focus:border-purple-500">

                    <p class="text-[10px] text-purple-400 mt-2">

                        Enter your 8 digit secret code

                    </p>

                </div>


                <button
                    type="submit"
                    class="w-full py-4
                           rounded-xl
                           font-bold text-sm
                           bg-gradient-to-r
                           from-purple-600
                           via-indigo-600
                           to-blue-600
                           hover:scale-[1.02]
                           transition
                           shadow-xl shadow-purple-900/30">

                    🚀 Login to Studio

                </button>


            </form>



            <!-- ================= SIGN UP FORM ================= -->

            <form id="signupForm"
                  onsubmit="handleSignup(event)"
                  class="space-y-4 hidden">


                <div class="grid grid-cols-2 gap-3">


                    <div>

                        <label class="block text-xs text-gray-300 mb-2">

                            First Name

                        </label>


                        <input
                            type="text"
                            id="firstName"
                            required
                            placeholder="Sohel"
                            class="w-full p-3
                                   rounded-xl
                                   bg-[#1a2035]
                                   border border-gray-700
                                   text-sm
                                   outline-none
                                   focus:border-purple-500">

                    </div>



                    <div>

                        <label class="block text-xs text-gray-300 mb-2">

                            Last Name

                        </label>


                        <input
                            type="text"
                            id="lastName"
                            required
                            placeholder="Rana"
                            class="w-full p-3
                                   rounded-xl
                                   bg-[#1a2035]
                                   border border-gray-700
                                   text-sm
                                   outline-none
                                   focus:border-purple-500">

                    </div>


                </div>



                <div>

                    <label class="block text-xs text-gray-300 mb-2">

                        Email অথবা Phone

                    </label>


                    <input
                        type="text"
                        id="signupEmail"
                        required
                        placeholder="example@gmail.com / 017XXXXXXXX"
                        class="w-full p-3.5
                               rounded-xl
                               bg-[#1a2035]
                               border border-gray-700
                               text-sm
                               outline-none
                               focus:border-purple-500">

                </div>



                <div>

                    <label class="block text-xs text-gray-300 mb-2">

                        Create 8 Digit Secret Code

                    </label>


                    <input
                        type="password"
                        id="signupPassword"
                        required
                        maxlength="8"
                        pattern="[0-9]{8}"
                        placeholder="••••••••"
                        class="w-full p-3.5
                               rounded-xl
                               bg-[#1a2035]
                               border border-gray-700
                               tracking-[8px]
                               text-sm
                               outline-none
                               focus:border-purple-500">

                </div>



                <button
                    type="submit"
                    class="w-full py-4
                           rounded-xl
                           font-bold text-sm
                           bg-gradient-to-r
                           from-purple-600
                           via-pink-600
                           to-indigo-600
                           hover:scale-[1.02]
                           transition">

                    ✨ Create Account

                </button>


            </form>


        </div>


        <p class="text-center text-gray-600 text-[11px] mt-6">

            © 2026 Sohel AI Studio. All Rights Reserved.

        </p>


    </div>

</div>
